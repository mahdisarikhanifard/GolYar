name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate EXACT Gol Negar V25.15 project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GOL NEGAR V25.15 BUILD"
          echo "========================================"

          # اگر پروژه مستقیماً در Repository است، همان را استفاده کن
          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            echo "Gradle project found in repository root."
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            # فقط و فقط ZIP نسخه 25.15 مجاز است
            ZIP_FILE="$GITHUB_WORKSPACE/GolNegar_GitHubReady_v25.15_Stable.zip"

            if [ ! -f "$ZIP_FILE" ]; then
              echo "ERROR: Exact V25.15 ZIP was not found:"
              echo "$ZIP_FILE"
              echo ""
              echo "Available files:"
              find "$GITHUB_WORKSPACE" -maxdepth 2 -type f | sort
              exit 1
            fi

            echo "Using EXACT ZIP:"
            echo "$ZIP_FILE"

            rm -rf "$GITHUB_WORKSPACE/build_source"
            mkdir -p "$GITHUB_WORKSPACE/build_source"

            unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/build_source"

            SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/build_source" \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              | head -n 1)

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle.kts was not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "SELECTED PROJECT"
          echo "$PROJECT_DIR"
          echo "========================================"

      - name: Verify EXACT V25.15 source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f "settings.gradle.kts"
          test -f "app/build.gradle.kts"
          test -f "app/src/main/java/com/example/golyar/MainActivity.kt"

          echo "Checking version..."

          grep -n 'versionName' app/build.gradle.kts
          grep -n 'versionCode' app/build.gradle.kts

          if ! grep -q 'versionName = "25.15"' app/build.gradle.kts; then
            echo "ERROR: This is NOT V25.15."
            exit 1
          fi

          if ! grep -q 'versionCode = 25' app/build.gradle.kts; then
            echo "ERROR: Expected versionCode 25."
            exit 1
          fi

          echo "Checking payment page..."

          COUNT=$(grep -c 'showSellerGreenhousePaymentPage' \
            app/src/main/java/com/example/golyar/MainActivity.kt || true)

          echo "showSellerGreenhousePaymentPage occurrences: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: Payment page source was not found."
            exit 1
          fi

          echo "========================================"
          echo "V25.15 SOURCE VERIFICATION PASSED"
          echo "========================================"

      - name: Build Gol Negar V25.15
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING GOL NEGAR V25.15"
          echo "========================================"

          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for APK..."

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            "release/GolNegar-v25.15-debug.apk"

          echo "========================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh release/GolNegar-v25.15-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v25.15-debug-apk
          path: release/GolNegar-v25.15-debug.apk
          if-no-files-found: error
