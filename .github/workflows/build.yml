name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate exact Gol Negar v1.1.10 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GolNegar_GitHubReady_v1.1.10_BuildSyncHardening.zip"

          echo "Looking for:"
          echo "$ZIP_FILE"
          echo

          if [ ! -f "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
            echo "ERROR: Exact ZIP file was not found."
            echo
            echo "Files in repository root:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$GITHUB_WORKSPACE/$ZIP_FILE" -d build_source

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build_source" \
            -type f \
            -name 'settings.gradle.kts' \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "EXACT SOURCE FOUND"
          echo "========================================"
          echo "$ZIP_FILE"
          echo
          echo "Project directory:"
          echo "$PROJECT_DIR"
          echo "========================================"

      - name: Validate v1.1.10 source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking MainActivity.kt..."
          test -s app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking sectionTitle..."
          grep -n "sectionTitle" \
            app/src/main/java/com/example/golyar/MainActivity.kt || true

          echo
          echo "Checking version..."
          grep -n "versionName" app/build.gradle.kts || true

          echo
          echo "Source validation completed."

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project files..."

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/google-services.json"

          echo "Project files: OK"

      - name: Build Gol Negar v1.1.10
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "STARTING GRADLE BUILD"
          echo "========================================"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          STATUS=${PIPESTATUS[0]}

          echo
          echo "========================================"
          echo "GRADLE EXIT CODE: $STATUS"
          echo "========================================"

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "========================================"
            echo "LAST 120 LINES OF GRADLE LOG"
            echo "========================================"

            tail -n 120 "$GITHUB_WORKSPACE/build.log"

            echo
            echo "========================================"
            echo "ERROR LINES FOUND IN GRADLE LOG"
            echo "========================================"

            grep -n -E \
              "FAILURE:|What went wrong:|Execution failed|error:|ERROR:|Unresolved reference|e: |Caused by:" \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -n 100 || true

            echo
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            exit "$STATUS"
          fi

          echo
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "========================================"

      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.1.10-build-log
          path: build.log
          if-no-files-found: warn

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name '*.apk' \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/GolNegar-v1.1.10-debug.apk

          echo "APK created:"
          ls -lh release/GolNegar-v1.1.10-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.1.10-debug.apk
          path: release/GolNegar-v1.1.10-debug.apk
          if-no-files-found: error
