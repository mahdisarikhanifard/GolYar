name: Build GolYar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check v24.1 ZIP
        run: |
          ZIP_FILE="GolYar_GitHubReady_v24.1_SellerAutoLogin.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: v24.1 ZIP not found"
            exit 1
          fi

          echo "ZIP FOUND:"
          ls -lh "$ZIP_FILE"

      - name: Extract v24.1
        run: |
          rm -rf build_source
          mkdir build_source

          unzip -q \
            "GolYar_GitHubReady_v24.1_SellerAutoLogin.zip" \
            -d build_source

          echo "===== EXTRACTED FILES ====="
          find build_source -maxdepth 4 -type f | sort

      - name: Find Gradle project
        run: |
          echo "===== SEARCHING FOR GRADLEW ====="

          GRADLEW=$(find build_source \
            -type f \
            -name gradlew \
            | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "GRADLEW FOUND:"
          echo "$GRADLEW"

          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "===== APK FILES ====="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Prepare APK
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            "release/GolYar-v24.1-SellerAutoLogin-debug.apk"

          echo "======================================"
          echo "GolYar v24.1 APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GolYar-v24.1-SellerAutoLogin-debug-apk
          path: release/GolYar-v24.1-SellerAutoLogin-debug.apk
          if-no-files-found: error
