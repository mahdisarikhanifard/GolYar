name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate exact Gol Negar source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="GolNegar_GitHubReady_v1.1.9_DeepSyncFix.zip"

          if [ ! -f "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE is missing. Upload exactly this file to the repository root."
            exit 1
          fi

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$GITHUB_WORKSPACE/$ZIP_FILE" -d build_source

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build_source" \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ] || \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: The exact ZIP is not a valid Android Gradle project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Using EXACT source:"
          echo "$ZIP_FILE"
          echo "======================================"

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/google-services.json"

          echo "Project verification: OK"

      - name: Build Gol Negar v1.1.9
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          status=${PIPESTATUS[0]}

          echo "Gradle exit code: $status"

          exit "$status"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.1.9-build-log
          path: build.log
          if-no-files-found: warn

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name '*.apk' \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/GolNegar-v1.1.9-debug.apk

          ls -lh release/GolNegar-v1.1.9-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.1.9-debug.apk
          path: release/GolNegar-v1.1.9-debug.apk
          if-no-files-found: error
