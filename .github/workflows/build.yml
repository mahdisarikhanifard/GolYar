name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate newest Gol Negar source
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Searching for Gol Negar source ZIP..."
          echo "======================================"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname 'GolNegar_GitHubReady_*.zip' \
            -printf '%T@ %p\n' \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2- || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No GolNegar_GitHubReady_*.zip was found."
            echo
            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print | sort || true
            exit 1
          fi

          echo "Selected source ZIP:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/build_source"
          mkdir -p "$GITHUB_WORKSPACE/build_source"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/build_source"

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build_source" \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts was not found inside the ZIP."
            find "$GITHUB_WORKSPACE/build_source" -maxdepth 6 -type f | sort
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: build.gradle.kts is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Source selected successfully."
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "======================================"

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project..."

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "WARNING: google-services.json was not found."
          fi

          echo "Project verification: OK"

          echo
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f \
            \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'AndroidManifest.xml' \) \
            -print | sort

      - name: Show build environment
        shell: bash
        run: |
          set +e

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version

          echo
          echo "Selected ZIP:"
          echo "$SOURCE_ZIP"

          echo
          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Build Gol Negar
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "BUILDING GOL NEGAR"
          echo "======================================"
          echo "Source: $SOURCE_ZIP"
          echo "Project: $PROJECT_DIR"
          echo

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          status=${PIPESTATUS[0]}

          echo
          echo "======================================"
          echo "Gradle exit code: $status"
          echo "======================================"

          if [ "$status" -ne 0 ]; then
            echo
            echo "========== IMPORTANT ERROR LINES =========="

            grep -n -E \
              "FAILURE:|What went wrong:|Execution failed|Caused by:|error:|e: |Unresolved reference|AAPT|Manifest merger|Could not" \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -n 100 || true

            echo
            echo "========== END ERROR SUMMARY =========="
          fi

          exit "$status"

      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-build-log
          path: build.log
          if-no-files-found: warn

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name '*.apk' \
            -print \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."

            echo
            echo "Searching build outputs:"
            find "$PROJECT_DIR/app/build" \
              -maxdepth 6 \
              -type f \
              \( -name '*.apk' -o -name '*.aab' \) \
              -print || true

            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/GolNegar-debug.apk"

          echo "APK created:"
          ls -lh "$GITHUB_WORKSPACE/release/GolNegar-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-debug-apk
          path: release/GolNegar-debug.apk
          if-no-files-found: error
