name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate exact Gol Negar v1.3.5 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GolNegar_FullAuditFix_v1.3.5_RebuiltLedgerPages.zip"

          echo "========================================"
          echo "BUILDING GOL NEGAR V1.3.5"
          echo "========================================"
          echo "Required source:"
          echo "$ZIP_FILE"
          echo ""

          if [ ! -f "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
            echo "ERROR: Required v1.3.5 ZIP was NOT found."
            echo ""
            echo "ZIP files currently in repository:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print | sort
            exit 1
          fi

          echo "FOUND EXACT V1.3.5 SOURCE:"
          ls -lh "$GITHUB_WORKSPACE/$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/build_source"

          mkdir -p "$GITHUB_WORKSPACE/build_source"

          unzip -q \
            "$GITHUB_WORKSPACE/$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/build_source"

          echo ""
          echo "Extracted source tree:"
          find "$GITHUB_WORKSPACE/build_source" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -200

          PROJECT_SETTINGS="$(
            find "$GITHUB_WORKSPACE/build_source" \
              -type f \
              -name "settings.gradle.kts" \
              -print -quit
          )"

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"

          echo ""
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify this is REALLY v1.3.5
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING SOURCE VERSION"
          echo "========================================"

          test -f app/build.gradle.kts
          test -f app/src/main/java/com/example/golyar/MainActivity.kt

          echo ""
          echo "Checking Gradle version..."
          grep -n 'versionName' app/build.gradle.kts
          grep -n 'versionCode' app/build.gradle.kts

          grep -q 'versionName = "1.3.5"' app/build.gradle.kts
          grep -q 'versionCode = 65' app/build.gradle.kts

          echo "Version check PASSED."

          echo ""
          echo "Checking rebuilt ledger pages..."

          grep -q 'showMiscSale' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'showMiscSalesHistory' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'showGreenhouseExpense' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'showGreenhousePaymentsHistory' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'showFinancialReport' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Ledger page check PASSED."

          echo ""
          echo "Checking local SQLite writes..."

          grep -q 'insertOrThrow' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'misc_sales' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'greenhouse_payments' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "SQLite write check PASSED."

          echo ""
          echo "Checking local-first financial report..."

          grep -q 'miscSales()' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'greenhousePayments()' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'miscTotal' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'expenseTotal' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Report check PASSED."

          echo ""
          echo "Checking Firebase collections..."

          grep -q '"misc_sales"' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q '"greenhouse_payments"' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Firebase collection check PASSED."

          echo ""
          echo "========================================"
          echo "V1.3.5 SOURCE VERIFIED SUCCESSFULLY"
          echo "========================================"

      - name: Run smoke tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Running project smoke tests..."

          python smoke_test.py

          echo ""
          echo "Smoke tests PASSED."

      - name: Build Gol Negar v1.3.5
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "GRADLE BUILD — GOL NEGAR V1.3.5"
          echo "========================================"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "GRADLE EXIT CODE: $STATUS"

          if [ "$STATUS" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            echo ""
            echo "Important errors:"

            grep -n -E \
              '(^|[^A-Za-z])(e:|error:|ERROR|FAILURE:|Execution failed|Unresolved reference|CompilationErrorException|Caused by:)' \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -300 \
              || true

            echo ""
            echo "Last 350 log lines:"

            tail -350 "$GITHUB_WORKSPACE/build.log"

          else

            echo ""
            echo "========================================"
            echo "BUILD SUCCESSFUL — V1.3.5"
            echo "========================================"

          fi

          exit "$STATUS"

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK:"
          echo "$APK_SOURCE"

          if [ ! -f "$APK_SOURCE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          ls -lh "$APK_SOURCE"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp \
            "$APK_SOURCE" \
            "$GITHUB_WORKSPACE/release/GolNegar-v1.3.5-debug.apk"

          echo ""
          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/release/GolNegar-v1.3.5-debug.apk"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.3.5-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.3.5-debug
          path: release/GolNegar-v1.3.5-debug.apk
          if-no-files-found: error
