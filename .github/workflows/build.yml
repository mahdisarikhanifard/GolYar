name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify Gol Negar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="GolNegar_v1.4.7_Source.zip"
          if [ ! -s "$ZIP_FILE" ]; then
            echo "::error::Missing source archive: $ZIP_FILE"
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/build_source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/build_source"
          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/build_source" -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle.kts not found inside source ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Validate project and run smoke tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -s settings.gradle.kts
          test -s build.gradle.kts
          test -s app/build.gradle.kts
          test -s app/google-services.json
          test -s app/src/main/java/com/example/golyar/MainActivity.kt
          test -s app/src/main/res/drawable/ic_bouquet.png
          test -s smoke_test.py
          grep -q 'versionName = "1.4.7"' app/build.gradle.kts
          grep -q 'versionCode = 77' app/build.gradle.kts
          python3 smoke_test.py

      - name: Build debug APK and capture log
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -uo pipefail
          set +e
          gradle clean assembleDebug --no-daemon --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "========== COMPILER ERRORS =========="
            grep -n -E '(^|[[:space:]])e: |Unresolved reference|Argument type mismatch|Type mismatch|Compilation error|FAILURE:|What went wrong:' "$GITHUB_WORKSPACE/build.log" | tail -n 100 || true
            tail -n 160 "$GITHUB_WORKSPACE/build.log" || true
          fi
          exit "$STATUS"

      - name: Verify and stage APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/GolNegar-v1.4.7-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/release/GolNegar-v1.4.7-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.4.7-debug
          path: release/GolNegar-v1.4.7-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.4.7-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14
