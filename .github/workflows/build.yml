name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ─────────────────────────────────────
      # Checkout repository
      # ─────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4


      # ─────────────────────────────────────
      # Java 17
      # ─────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ─────────────────────────────────────
      # Gradle
      # ─────────────────────────────────────
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'


      # ─────────────────────────────────────
      # Locate EXACT Gol Negar V25.18 source
      # ─────────────────────────────────────
      - name: Locate EXACT Gol Negar V25.18 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/GolNegar_GitHubReady_v25.18_FirebaseConnectFix.zip"

          echo "Looking for:"
          echo "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: V25.18 ZIP not found."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/build_source"

          mkdir -p "$GITHUB_WORKSPACE/build_source"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/build_source"

          PROJECT_DIR=$(find \
            "$GITHUB_WORKSPACE/build_source" \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit \
            | xargs -r dirname)

          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ─────────────────────────────────────
      # Verify EXACT V25.18 source
      # ─────────────────────────────────────
      - name: Verify EXACT V25.18 source
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Checking project:"
          pwd

          echo
          echo "Checking version..."

          if ! grep -q 'versionName = "25.18"' app/build.gradle.kts; then
            echo "ERROR: versionName 25.18 not found."
            grep -n 'versionName\|versionCode' app/build.gradle.kts || true
            exit 1
          fi

          echo "OK: versionName 25.18"

          echo
          echo "Checking Firebase-related collections..."

          if ! grep -q 'misc_sales' app/src/main/java/com/example/golyar/MainActivity.kt; then
            echo "WARNING: misc_sales not found in MainActivity.kt"
          fi

          if ! grep -q 'greenhouse_payments' app/src/main/java/com/example/golyar/MainActivity.kt; then
            echo "WARNING: greenhouse_payments not found in MainActivity.kt"
          fi

          if ! grep -q 'petty_cash_people' app/src/main/java/com/example/golyar/MainActivity.kt; then
            echo "WARNING: petty_cash_people not found in MainActivity.kt"
          fi

          echo
          echo "Source verification completed."


      # ─────────────────────────────────────
      # Build
      # ─────────────────────────────────────
      - name: Build Gol Negar V25.18
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Building Gol Negar V25.18..."

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ─────────────────────────────────────
      # Find APK
      # ─────────────────────────────────────
      - name: Find APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print \
            | head -n 1)

          if [ -z "${APK:-}" ]; then
            echo "ERROR: APK not found."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/GolNegar-v25.18-debug.apk"


      # ─────────────────────────────────────
      # Upload APK
      # ─────────────────────────────────────
      - name: Upload Gol Negar V25.18 APK
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v25.18-debug-apk
          path: release/GolNegar-v25.18-debug.apk
          if-no-files-found: error


      # ─────────────────────────────────────
      # Upload build log
      # ─────────────────────────────────────
      - name: Upload V25.18 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v25.18-build-log
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/logs/**
          if-no-files-found: warn
