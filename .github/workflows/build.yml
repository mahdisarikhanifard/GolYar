name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GolNegar_SellerSyncRebuild_120.zip"

          echo "========================================"
          echo "Looking for source ZIP"
          echo "========================================"
          echo "ZIP_FILE=$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: Source ZIP not found."
            echo ""
            echo "ZIP files available in repository:"
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          echo ""
          echo "Source ZIP found:"
          ls -lh "$ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build_source
          mkdir -p build_source

          echo "Extracting source..."

          unzip -q "GolNegar_SellerSyncRebuild_120.zip" \
            -d build_source

          echo ""
          echo "Extracted Gradle files:"
          find build_source -maxdepth 4 -type f \
            \( -name "settings.gradle.kts" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \) \
            -print

      - name: Find Gradle project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_SETTINGS="$(find "$GITHUB_WORKSPACE/build_source" \
            -name "settings.gradle.kts" \
            -type f \
            -print -quit)"

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo "PROJECT DIRECTORY"
          echo "========================================"
          echo "$PROJECT_DIR"

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING PROJECT"
          echo "========================================"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f \
            "$PROJECT_DIR/app/src/main/java/com/example/golyar/MainActivity.kt"

          echo ""
          echo "MainActivity found."

          echo ""
          echo "Checking Firebase configuration..."

          if [ -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "google-services.json found."
          else
            echo "WARNING: google-services.json not found."
          fi

          echo ""
          echo "Checking seller Sync code..."

          grep -n -E \
            "syncWithFirebaseIfOnline|seller_remote_id|last_sync|last_sync_error|FirebaseAuth|FirebaseFirestore" \
            "$PROJECT_DIR/app/src/main/java/com/example/golyar/MainActivity.kt" \
            || true

          echo ""
          echo "Source verification completed."

      - name: Build APK
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING GOL NEGAR V1.2.0"
          echo "========================================"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "GRADLE EXIT CODE: $STATUS"
          echo "========================================"

          if [ "$STATUS" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "KOTLIN / GRADLE ERRORS"
            echo "========================================"

            grep -n -E \
              '(^|[^A-Za-z])(e:|error:|ERROR|FAILURE:|Execution failed|Syntax error|Unresolved reference|CompilationErrorException|Caused by:)' \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -n 250 \
              || true

            echo ""
            echo "========================================"
            echo "LAST 300 LINES OF BUILD LOG"
            echo "========================================"

            tail -n 300 "$GITHUB_WORKSPACE/build.log"
          fi

          exit "$STATUS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gol-negar-v1.2.0-build-log
          path: build.log
          if-no-files-found: warn

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/apk_output"

          APK_SOURCE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_SOURCE" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          cp "$APK_SOURCE" \
            "$GITHUB_WORKSPACE/apk_output/GolNegar-v1.2.0-debug.apk"

          echo ""
          echo "========================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh \
            "$GITHUB_WORKSPACE/apk_output/GolNegar-v1.2.0-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.2.0-APK
          path: apk_output/GolNegar-v1.2.0-debug.apk
          if-no-files-found: error
