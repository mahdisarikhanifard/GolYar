name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Gol Negar
        run: |
          gradle clean assembleDebug --no-daemon

      - name: Find APK
        run: |
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Prepare APK
        run: |
          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          mkdir -p release
          cp "$APK" \
            "release/GolNegar-v25.0-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v25.0-debug-apk
          path: release/GolNegar-v25.0-debug.apk
          if-no-files-found: error
