name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate EXACT Gol Negar v25.23 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/GolNegar_GitHubReady_v25.23_LoginAndSellerFix.zip"

          test -f "$ZIP_FILE" || {
            echo "ERROR: v25.23 ZIP not found"
            exit 1
          }

          rm -rf "$GITHUB_WORKSPACE/build_source"
          mkdir -p "$GITHUB_WORKSPACE/build_source"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/build_source"

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build_source" \
            -type f \
            -name 'settings.gradle.kts' \
            -print \
            -quit | xargs -r dirname)

          test -n "${PROJECT_DIR:-}" || {
            echo "ERROR: Android project not found"
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Using project:"
          echo "$PROJECT_DIR"

      - name: Verify EXACT v25.23 source
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          grep -q 'versionName = "25.23"' app/build.gradle.kts

          grep -q 'versionCode = 31' app/build.gradle.kts

          grep -q 'whereEqualTo("seller_id", sellerId)' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "v25.23 source verification passed."

      - name: Build Gol Negar v25.23
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle clean assembleDebug --no-daemon --stacktrace --info

      - name: Find APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print | head -n 1)

          test -n "${APK:-}" || {
            echo "ERROR: APK not found"
            exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/GolNegar-v25.23-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/release/GolNegar-v25.23-debug.apk"

      - name: Upload Gol Negar v25.23 APK
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v25.23-debug-apk
          path: release/GolNegar-v25.23-debug.apk
          if-no-files-found: error

      - name: Upload v25.23 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v25.23-build-log
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/logs/**
          if-no-files-found: warn
