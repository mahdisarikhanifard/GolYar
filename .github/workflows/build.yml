name: Build GolYar APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract GolYar v22.0
        run: |
          unzip -q GolYar_GitHubReady_v22.0.zip -d golyar_project

      - name: Find Gradle project
        run: |
          find golyar_project -maxdepth 4 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: Build debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find golyar_project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GolYar-v22.0-debug-apk
          path: golyar_project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
