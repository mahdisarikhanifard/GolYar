name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Detect project
        shell: bash
        run: |
          echo "======================================"
          echo "Detecting Gol Negar project"
          echo "======================================"

          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "PROJECT_MODE=ROOT" >> "$GITHUB_ENV"
            echo "BUILD_DIR=." >> "$GITHUB_ENV"
            echo "Gradle project found in repository root."

          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Gradle project or ZIP file found."
              exit 1
            fi

            echo "ZIP found:"
            echo "$ZIP_FILE"

            rm -rf build_source
            mkdir -p build_source

            unzip -q "$ZIP_FILE" -d build_source

            echo "Extracted files:"
            find build_source -maxdepth 5 -type f | sort

            SETTINGS_FILE=$(find build_source \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              | head -1)

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle or settings.gradle.kts not found."
              exit 1
            fi

            BUILD_DIR=$(dirname "$SETTINGS_FILE")

            echo "Gradle project found at:"
            echo "$BUILD_DIR"

            echo "PROJECT_MODE=ZIP" >> "$GITHUB_ENV"
            echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          fi

      - name: Verify Gradle project
        shell: bash
        run: |
          echo "======================================"
          echo "Gradle project verification"
          echo "======================================"

          echo "Build directory:"
          echo "$BUILD_DIR"

          if [ ! -f "$BUILD_DIR/settings.gradle.kts" ] && \
             [ ! -f "$BUILD_DIR/settings.gradle" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          if [ ! -f "$BUILD_DIR/build.gradle.kts" ] && \
             [ ! -f "$BUILD_DIR/build.gradle" ]; then
            echo "ERROR: Root Gradle build file not found."
            exit 1
          fi

          echo "Gradle project is valid."

          find "$BUILD_DIR" -maxdepth 3 -type f | sort

      - name: Build Gol Negar
        shell: bash
        run: |
          echo "======================================"
          echo "Building Gol Negar v25.0"
          echo "======================================"

          cd "$BUILD_DIR"

          gradle clean assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          echo "======================================"
          echo "Searching for APK"
          echo "======================================"

          find "$BUILD_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Prepare APK
        shell: bash
        run: |
          APK=$(find "$BUILD_DIR" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            "release/GolNegar-v25.0-debug.apk"

          echo "======================================"
          echo "Gol Negar v25.0 APK CREATED"
          echo "======================================"

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v25.0-debug-apk
          path: release/GolNegar-v25.0-debug.apk
          if-no-files-found: error
