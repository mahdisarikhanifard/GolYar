name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate EXACT Gol Negar v25.24 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/GolNegar_GitHubReady_v25.24_SellerFirebaseFix.zip"

          test -f "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/build_source"
          mkdir -p "$GITHUB_WORKSPACE/build_source"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/build_source"

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build_source" \
            -type f \
            -name 'settings.gradle.kts' \
            -print \
            -quit | xargs -r dirname)

          test -n "${PROJECT_DIR:-}"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify EXACT v25.24 source
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          grep -q 'versionName = "25.24"' app/build.gradle.kts
          grep -q 'versionCode = 32' app/build.gradle.kts

          echo "v25.24 source verified."

      - name: Build Gol Negar v25.24
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle clean assembleDebug --no-daemon --stacktrace --info

      - name: Find APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print | head -n 1)

          test -n "${APK:-}"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/GolNegar-v25.24-debug.apk"

      - name: Upload Gol Negar v25.24 APK
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v25.24-debug-apk
          path: release/GolNegar-v25.24-debug.apk
          if-no-files-found: error

      - name: Upload v25.24 build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v25.24-build-log
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/logs/**
          if-no-files-found: warn
