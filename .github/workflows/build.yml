name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate exact Gol Negar source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="GolNegar_MultiUser_UIAndSyncFix_124.zip"

          echo "========================================"
          echo "BUILDING GOL NEGAR V1.2.4"
          echo "========================================"

          if [ ! -f "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found: $ZIP_FILE"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name '*.zip' -print
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/build_source"
          mkdir -p "$GITHUB_WORKSPACE/build_source"

          unzip -q "$GITHUB_WORKSPACE/$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/build_source"

          PROJECT_SETTINGS="$(find "$GITHUB_WORKSPACE/build_source" \
            -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Validate source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/google-services.json
          test -f firestore.rules
          test -f app/src/main/java/com/example/golyar/MainActivity.kt
          test -f app/src/main/res/drawable/ic_bouquet.png

          grep -q 'versionName = "1.2.4"' app/build.gradle.kts
          grep -q 'versionCode = 55' app/build.gradle.kts

          echo "Checking back-stack navigation..."
          grep -q 'screenBackStack' app/src/main/java/com/example/golyar/MainActivity.kt
          grep -q 'OnBackPressedCallback' app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking seller payment identity..."
          grep -q '"payments" to rows' app/src/main/java/com/example/golyar/MainActivity.kt
          grep -q 'seller_remote_id.*getString(8)' app/src/main/java/com/example/golyar/MainActivity.kt
          grep -q 'data\["auth_uid"\]' app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking multi-user support..."
          grep -q 'GREENHOUSE:STAFF:' app/src/main/java/com/example/golyar/MainActivity.kt
          grep -q 'showGreenhouseUsers' app/src/main/java/com/example/golyar/MainActivity.kt
          grep -q 'role.*STAFF' firestore.rules
          grep -q 'function isGreenhouseUser' firestore.rules

          echo "Checking expense/miscellaneous data..."
          grep -q 'misc_sales' app/src/main/java/com/example/golyar/MainActivity.kt
          grep -q 'greenhouse_payments' app/src/main/java/com/example/golyar/MainActivity.kt
          grep -q 'expense_types' app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking Firebase payment Rules..."
          grep -q 'match /payments/{id}' firestore.rules
          grep -q 'request.resource.data.auth_uid == request.auth.uid' firestore.rules

          echo "Source validation PASSED."

      - name: Run smoke tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python smoke_test.py

      - name: Build Gol Negar v1.2.4
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          STATUS=${PIPESTATUS[0]}

          echo "GRADLE EXIT CODE: $STATUS"

          if [ "$STATUS" -ne 0 ]; then
            echo "================ BUILD ERRORS ================"

            grep -n -E \
              '(^|[^A-Za-z])(e:|error:|ERROR|FAILURE:|Execution failed|Syntax error|Unresolved reference|CompilationErrorException|Caused by:)' \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -n 250 || true

            echo "================ LAST LOG LINES ================"

            tail -n 300 "$GITHUB_WORKSPACE/build.log"
          fi

          exit "$STATUS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.2.4-build-log
          path: build.log
          if-no-files-found: warn

      - name: Prepare APK
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK_SOURCE"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_SOURCE" \
            "$GITHUB_WORKSPACE/release/GolNegar-v1.2.4-debug.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/release/GolNegar-v1.2.4-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.2.4-debug.apk
          path: release/GolNegar-v1.2.4-debug.apk
          if-no-files-found: error
