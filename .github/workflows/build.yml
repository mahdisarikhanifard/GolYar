name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GolNegar_v1.4.5_VersionThenUserName.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found: $ZIP_FILE"
            echo "ZIP files in repository:"
            find . -maxdepth 3 -type f -iname '*.zip'
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/build_source"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/build_source"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/build_source" \
            -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found in ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Validate source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/google-services.json
          test -f smoke_test.py
          test -s app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking application version..."

          grep -q 'versionName = "1.4.5"' app/build.gradle.kts
          grep -q 'versionCode = 75' app/build.gradle.kts

          echo "Source validation passed."

      - name: Run smoke tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 smoke_test.py

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.4.5-build-log
          path: build.log
          if-no-files-found: warn

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_SOURCE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p release

          cp "$APK_SOURCE" release/GolNegar-v1.4.5-debug.apk

          ls -lh release/GolNegar-v1.4.5-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.4.5-debug.apk
          path: release/GolNegar-v1.4.5-debug.apk
          if-no-files-found: error
