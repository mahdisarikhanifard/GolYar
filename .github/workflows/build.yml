name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate exact Gol Negar source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GolNegar_UIFix_1010.zip"

          echo "========================================"
          echo "Looking for source ZIP"
          echo "Expected file: $ZIP_FILE"
          echo "========================================"

          if [ ! -f "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in repository root."
            echo ""
            echo "ZIP files currently in repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort
            exit 1
          fi

          echo "FOUND: $ZIP_FILE"

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$GITHUB_WORKSPACE/$ZIP_FILE" -d build_source

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build_source" \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/java/com/example/golyar/MainActivity.kt" ]; then
            echo "ERROR: MainActivity.kt was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Using EXACT source ZIP:"
          echo "$ZIP_FILE"
          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"
          echo "========================================"

      - name: Validate source before Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking MainActivity.kt..."
          test -s app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking build.gradle.kts..."
          test -s app/build.gradle.kts

          echo "Checking google-services.json..."
          test -s app/google-services.json

          echo "Checking sectionTitle..."
          grep -q 'private fun sectionTitle' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking Gol Negar version..."
          grep -q 'versionName = "1.1.10"' \
            app/build.gradle.kts

          echo "Checking for the previously broken multiline string..."

          if grep -n -A2 -B2 'ورود فروشنده انجام شد، اما همگام‌سازی کامل نشد' \
            app/src/main/java/com/example/golyar/MainActivity.kt; then
            echo "The seller-login message was found."
          fi

          echo "========================================"
          echo "SOURCE VALIDATION: OK"
          echo "========================================"

      - name: Show source identity
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "========================================"
          echo "SOURCE IDENTITY"
          echo "========================================"

          echo "--- Version ---"
          grep -n 'versionName' app/build.gradle.kts || true

          echo "--- MainActivity path ---"
          realpath app/src/main/java/com/example/golyar/MainActivity.kt

          echo "--- MainActivity size ---"
          wc -c app/src/main/java/com/example/golyar/MainActivity.kt

          echo "--- MainActivity checksum ---"
          sha256sum app/src/main/java/com/example/golyar/MainActivity.kt

          echo "========================================"

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/google-services.json"

          echo "Project verification: OK"

      - name: Build Gol Negar
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          status=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "GRADLE EXIT CODE: $status"
          echo "========================================"

          exit "$status"

      - name: Print useful errors
        if: failure()
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "ERROR LINES FOUND IN GRADLE LOG"
          echo "========================================"

          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then

            grep -n -E \
              '(^|[^A-Za-z])(e:|error:|ERROR|FAILURE:|Execution failed|Syntax error|Unresolved reference|CompilationErrorException|Caused by:)' \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -n 120 || true

            echo ""
            echo "========================================"
            echo "LAST 160 LINES OF GRADLE LOG"
            echo "========================================"

            tail -n 160 "$GITHUB_WORKSPACE/build.log"

          else
            echo "build.log was not found."
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-build-log
          path: build.log
          if-no-files-found: warn

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name '*.apk' \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/GolNegar-debug.apk

          echo "========================================"
          echo "APK CREATED:"
          echo "$APK"
          echo "========================================"

          ls -lh release/GolNegar-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-debug.apk
          path: release/GolNegar-debug.apk
          if-no-files-found: error
