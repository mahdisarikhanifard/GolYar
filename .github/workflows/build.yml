name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify Gol Negar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GolNegar_v1.4.5_VersionThenUserName.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found: $ZIP_FILE"
            echo "ZIP files available in repository:"
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/build_source"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/build_source"

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/build_source" \
              -type f \
              -name settings.gradle.kts \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle.kts was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Validate project files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -s settings.gradle.kts
          test -s build.gradle.kts
          test -s app/build.gradle.kts
          test -s app/google-services.json
          test -s app/src/main/java/com/example/golyar/MainActivity.kt
          test -s smoke_test.py

          grep -q 'versionName = "1.4.5"' \
            app/build.gradle.kts

          grep -q 'versionCode = 75' \
            app/build.gradle.kts

          echo "Project files validated."

      - name: Verify Kotlin carousel fix
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/example/golyar/MainActivity.kt"

          grep -Fq \
            'val spacing: Float = if (circles.size <= 1) 0f else usableHeight.toFloat() / (circles.size - 1).toFloat()' \
            "$FILE"

          grep -Fq \
            '(baseTop + i.toFloat() * spacing).toInt()' \
            "$FILE"

          echo "Kotlin carousel type checks passed."

      - name: Run project smoke tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 smoke_test.py

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -uo pipefail

          set +e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          STATUS=${PIPESTATUS[0]}

          set -e

          echo "Gradle exit code: $STATUS"

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "========== COMPILATION ERRORS =========="

            grep -n -E \
              '(^|[[:space:]])e: |Unresolved reference|Argument type mismatch|Type mismatch|None of the following candidates|Compilation error|FAILURE:|What went wrong:' \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -n 100 || true

            echo ""
            echo "========== LAST BUILD LOG LINES =========="

            tail -n 200 "$GITHUB_WORKSPACE/build.log" || true
          fi

          exit "$STATUS"

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/GolNegar-v1.4.5-debug.apk"

          echo "APK generated successfully:"
          ls -lh \
            "$GITHUB_WORKSPACE/release/GolNegar-v1.4.5-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.4.5-debug
          path: release/GolNegar-v1.4.5-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.4.5-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14
