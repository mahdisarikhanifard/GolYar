name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate EXACT Gol Negar V25.17 project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "       GOL NEGAR V25.17 BUILD"
          echo "========================================"

          # حالت اول:
          # پروژه مستقیماً در ریشه Repository است.
          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then

            echo "Gradle project found in repository root."

            PROJECT_DIR="$GITHUB_WORKSPACE"

          else

            # حالت دوم:
            # پروژه داخل ZIP نسخه 25.17 است.
            ZIP_FILE="$GITHUB_WORKSPACE/GolNegar_GitHubReady_v25.17_SellerPassword.zip"

            if [ ! -f "$ZIP_FILE" ]; then

              echo "ERROR: V25.17 ZIP was not found."
              echo ""
              echo "Expected:"
              echo "$ZIP_FILE"
              echo ""
              echo "Files found in repository:"
              find "$GITHUB_WORKSPACE" \
                -maxdepth 2 \
                -type f \
                | sort

              exit 1
            fi

            echo "========================================"
            echo "Using EXACT V25.17 ZIP:"
            echo "$ZIP_FILE"
            echo "========================================"

            rm -rf "$GITHUB_WORKSPACE/build_source"

            mkdir -p "$GITHUB_WORKSPACE/build_source"

            unzip -q "$ZIP_FILE" \
              -d "$GITHUB_WORKSPACE/build_source"

            SETTINGS_FILE=$(find \
              "$GITHUB_WORKSPACE/build_source" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              | head -n 1)

            if [ -z "$SETTINGS_FILE" ]; then

              echo "ERROR: settings.gradle.kts was not found."

              exit 1

            fi

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "SELECTED PROJECT"
          echo "$PROJECT_DIR"
          echo "========================================"

      - name: Verify EXACT V25.17 source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "Checking Gradle project..."
          echo "========================================"

          test -f "settings.gradle.kts"
          test -f "build.gradle.kts"
          test -f "app/build.gradle.kts"

          test -f \
            "app/src/main/java/com/example/golyar/MainActivity.kt"

          echo "Gradle project files: OK"

          echo ""
          echo "========================================"
          echo "Checking application version..."
          echo "========================================"

          grep -n "versionCode" \
            app/build.gradle.kts || true

          grep -n "versionName" \
            app/build.gradle.kts || true

          # فقط versionName بررسی می‌شود.
          # versionCode ممکن است بین نسخه‌ها تغییر کند
          # و نباید باعث توقف Build شود.

          if ! grep -q 'versionName = "25.17"' \
            app/build.gradle.kts; then

            echo ""
            echo "ERROR: Source is NOT V25.17."
            echo "Build stopped intentionally."

            exit 1
          fi

          echo ""
          echo "V25.17 source verification: PASSED"

          echo ""
          echo "========================================"
          echo "Checking seller password feature..."
          echo "========================================"

          if grep -q "رمز عبور" \
            app/src/main/java/com/example/golyar/MainActivity.kt; then

            echo "Seller password feature: FOUND"

          else

            echo "WARNING:"
            echo "Seller password text was not found."

          fi

          echo ""
          echo "========================================"
          echo "SOURCE VERIFICATION PASSED"
          echo "========================================"

      - name: Build Gol Negar V25.17
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "       BUILDING GOL NEGAR V25.17"
          echo "========================================"

          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching for APK..."
          echo "========================================"

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: APK was not created."

            exit 1

          fi

          mkdir -p release

          cp "$APK" \
            "release/GolNegar-v25.17-debug.apk"

          echo ""
          echo "========================================"
          echo "       APK CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh \
            "release/GolNegar-v25.17-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v25.17-debug-apk
          path: release/GolNegar-v25.17-debug.apk
          if-no-files-found: error
