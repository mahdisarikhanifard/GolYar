name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify Gol Negar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="GolNegar_v1.4.5_VersionThenUserName.zip"
          test -s "$ZIP_FILE" || { echo "::error::Missing $ZIP_FILE in repository root"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/build_source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/build_source"
          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/build_source" -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS_FILE" || { echo "::error::settings.gradle.kts not found in ZIP"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Validate source and run smoke tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/example/golyar/MainActivity.kt
          test -s app/build.gradle.kts
          test -s app/google-services.json
          python3 smoke_test.py

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle clean assembleDebug --no-daemon --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "::error::APK was not generated"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/GolNegar-v1.4.5-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.4.5-debug
          path: release/GolNegar-v1.4.5-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.4.5-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14
