name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate exact Gol Negar source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GolNegar_MultiUser_UIAndSyncFix_124_FIXED.zip"

          echo "========================================"
          echo "BUILDING GOL NEGAR V1.2.4 FIXED"
          echo "========================================"

          if [ ! -f "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found: $ZIP_FILE"
            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name '*.zip' -print
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/build_source"
          mkdir -p "$GITHUB_WORKSPACE/build_source"

          unzip -q "$GITHUB_WORKSPACE/$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/build_source"

          PROJECT_SETTINGS="$(find "$GITHUB_WORKSPACE/build_source" \
            -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Validate source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/google-services.json
          test -f firestore.rules
          test -f app/src/main/java/com/example/golyar/MainActivity.kt
          test -f app/src/main/res/drawable/ic_bouquet.png

          echo "Checking version..."

          grep -q 'versionName = "1.2.4"' \
            app/build.gradle.kts

          grep -q 'versionCode = 55' \
            app/build.gradle.kts

          echo "Checking fixed payments syntax..."

          grep -q '"payments" to rows' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking back-stack navigation..."

          grep -q 'screenBackStack' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'OnBackPressedCallback' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking seller payment identity..."

          grep -q 'seller_remote_id' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'auth_uid' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking multi-user support..."

          grep -q 'GREENHOUSE:STAFF:' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'showGreenhouseUsers' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'role.*STAFF' \
            firestore.rules

          grep -q 'function isGreenhouseUser' \
            firestore.rules

          echo "Checking expense and miscellaneous sales..."

          grep -q 'misc_sales' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'greenhouse_payments' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'expense_types' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking Firebase payment Rules..."

          grep -q 'match /payments/{id}' \
            firestore.rules

          grep -q 'request.resource.data.auth_uid == request.auth.uid' \
            firestore.rules

          echo "Checking payments line ending..."

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/example/golyar/MainActivity.kt")
          text = p.read_text(encoding="utf-8")

          lines = text.splitlines()

          found = False

          for i, line in enumerate(lines):
              if '"payments" to rows' in line:
                  found = True
                  print(f"payments mapping found at line {i + 1}")

                  if not line.rstrip().endswith("},"):
                      print("ERROR: payments mapping does not end with '},'")
                      print(line)
                      raise SystemExit(1)

                  print("payments mapping syntax check PASSED")
                  break

          if not found:
              print("ERROR: payments mapping not found")
              raise SystemExit(1)
          PY

          echo "========================================"
          echo "SOURCE VALIDATION PASSED"
          echo "========================================"

      - name: Run smoke tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Running smoke tests..."

          python3 smoke_test.py

          echo "Smoke tests PASSED."

      - name: Build Gol Negar v1.2.4
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "GRADLE BUILD - GOL NEGAR V1.2.4"
          echo "========================================"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "GRADLE EXIT CODE: $STATUS"

          if [ "$STATUS" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "BUILD FAILED - IMPORTANT ERRORS"
            echo "========================================"

            grep -n -E \
              '(^|[^A-Za-z])(e:|error:|ERROR|FAILURE:|Execution failed|Syntax error|Unresolved reference|CompilationErrorException|Caused by:)' \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -n 250 || true

            echo ""
            echo "========================================"
            echo "LAST 300 LOG LINES"
            echo "========================================"

            tail -n 300 "$GITHUB_WORKSPACE/build.log"
          fi

          exit "$STATUS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.2.4-FIXED-build-log
          path: build.log
          if-no-files-found: warn

      - name: Prepare APK
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."

          test -f "$APK_SOURCE"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_SOURCE" \
            "$GITHUB_WORKSPACE/release/GolNegar-v1.2.4-debug.apk"

          echo "APK created successfully:"

          ls -lh \
            "$GITHUB_WORKSPACE/release/GolNegar-v1.2.4-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.2.4-debug.apk
          path: release/GolNegar-v1.2.4-debug.apk
          if-no-files-found: error
