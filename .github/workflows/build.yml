name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate Gol Negar project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GOL NEGAR V25 BUILD WORKFLOW"
          echo "========================================"

          echo "Repository contents:"
          find . -maxdepth 2 -type f | sort

          # حالت 1: پروژه مستقیماً در ریشه Repository است
          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            echo "Gradle project found in repository root."
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          fi

          # حالت 2: پروژه به صورت ZIP در Repository آپلود شده
          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -name 'GolNegar_GitHubReady_v*.zip' \
            | sort \
            | tail -n 1)

          # اگر ZIP با نام GolNegar پیدا نشد، هر ZIP پروژه را امتحان کن
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f \
              -name '*.zip' \
              | sort \
              | tail -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Gradle project or ZIP file found."
            exit 1
          fi

          echo "Selected project ZIP:"
          echo "$ZIP_FILE"

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$ZIP_FILE" -d build_source

          echo "Extracted project:"
          find build_source -maxdepth 5 -type f | sort

          SETTINGS_FILE=$(find build_source \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android app Gradle file was not found."
            exit 1
          fi

          echo "========================================"
          echo "Gradle project:"
          echo "$PROJECT_DIR"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify V25 project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project..."

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "Project verification PASSED."

      - name: Build Gol Negar V25
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING GOL NEGAR V25.0"
          echo "========================================"

          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            "release/GolNegar-v25.0-debug.apk"

          echo "========================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh release/GolNegar-v25.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v25.0-debug-apk
          path: release/GolNegar-v25.0-debug.apk
          if-no-files-found: error
