name: Build Gol Negar APK v28

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'GolNegar_v28_FirebaseSecure.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check and extract Gol Negar project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f GolNegar_v28_FirebaseSecure.zip || {
            echo 'ERROR: GolNegar_v28_FirebaseSecure.zip was not found in the repository root.'
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/GolNegarProject"
          unzip -q GolNegar_v28_FirebaseSecure.zip -d "$RUNNER_TEMP/GolNegarProject"
          test -f "$RUNNER_TEMP/GolNegarProject/settings.gradle.kts"
          test -f "$RUNNER_TEMP/GolNegarProject/app/build.gradle.kts"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$RUNNER_TEMP/GolNegarProject" :app:assembleDebug --no-daemon --stacktrace
          cp "$RUNNER_TEMP/GolNegarProject/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/GolNegar-v28-debug.apk"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v28-debug-apk
          path: GolNegar-v28-debug.apk
          if-no-files-found: error

      - name: Upload Gradle diagnostic report if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v28-build-diagnostics
          path: |
            ${{ runner.temp }}/GolNegarProject/build/reports/problems/problems-report.html
            ${{ runner.temp }}/GolNegarProject/app/build/reports/**
          if-no-files-found: ignore
