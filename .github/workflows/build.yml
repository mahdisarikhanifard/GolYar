name: Build GolYar APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q GolYar_GitHubReady_v19.3_Firebase.zip
          cd GolYar_GitHub
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: GolYar_GitHub
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GolYar-debug-apk
          path: GolYar_GitHub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
