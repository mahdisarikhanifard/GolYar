name: Build GolYar APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q GolYar_GitHubReady_v21.2_Fixes.zip -d golyar_project
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/golyar_project" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: golyar_project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GolYar-debug-apk
          path: golyar_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
