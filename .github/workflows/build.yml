name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GolNegar_SyncStatusFix_1010.zip"

          echo "Looking for: $ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            echo "ZIP files in repository:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found:"
          ls -lh "$ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build_source
          mkdir -p build_source

          unzip -q "GolNegar_SyncStatusFix_1010.zip" -d build_source

          echo "Extracted project:"
          find build_source -maxdepth 3 -type f \
            \( -name "settings.gradle.kts" -o -name "build.gradle.kts" \) \
            -print

      - name: Find Gradle project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/build_source" \
            -name "settings.gradle.kts" \
            -type f \
            -print -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/golyar/MainActivity.kt"

          echo "MainActivity sync-related code:"
          grep -n -E \
            "syncWithFirebaseIfOnline|last_sync|last_sync_error" \
            "$PROJECT_DIR/app/src/main/java/com/example/golyar/MainActivity.kt" \
            || true

          echo "Source verification OK."

      - name: Build APK
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "GRADLE EXIT CODE: $STATUS"
          echo "========================================"

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "KOTLIN / GRADLE ERRORS"
            echo "========================================"

            grep -n -E \
              '(^|[^A-Za-z])(e:|error:|ERROR|FAILURE:|Execution failed|Syntax error|Unresolved reference|CompilationErrorException|Caused by:)' \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -n 200 || true

            echo ""
            echo "========================================"
            echo "LAST 250 LINES OF BUILD LOG"
            echo "========================================"

            tail -n 250 "$GITHUB_WORKSPACE/build.log"
          fi

          exit "$STATUS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gol-negar-build-log
          path: build.log
          if-no-files-found: warn

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/apk_output"

          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             "$GITHUB_WORKSPACE/apk_output/GolNegar-debug.apk"

          echo "APK created successfully:"
          ls -lh "$GITHUB_WORKSPACE/apk_output/GolNegar-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-APK
          path: apk_output/GolNegar-debug.apk
