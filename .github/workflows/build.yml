name: Build GolYar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify v24.1 source ZIP
        run: |
          ZIP_FILE="GolYar_GitHubReady_v24.1_SellerAutoLogin.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found!"
            echo "Repository files:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Found: $ZIP_FILE"

      - name: Extract v24.1
        run: |
          ZIP_FILE="GolYar_GitHubReady_v24.1_SellerAutoLogin.zip"

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$ZIP_FILE" -d build_source

          echo "Extracted source:"
          find build_source -maxdepth 3 -type f | sort | head -200

      - name: Locate Android project
        run: |
          if [ -f "build_source/settings.gradle" ] || \
             [ -f "build_source/settings.gradle.kts" ] || \
             [ -f "build_source/gradlew" ]; then
            echo "PROJECT_DIR=build_source" >> "$GITHUB_ENV"
          else
            PROJECT_DIR=$(find build_source -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Android project not found!"
              exit 1
            fi

            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build v24.1 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Rename APK
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            "release/GolYar-v24.1-SellerAutoLogin-debug.apk"

          echo "======================================"
          echo "GolYar v24.1 APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GolYar-v24.1-SellerAutoLogin-debug-apk
          path: release/GolYar-v24.1-SellerAutoLogin-debug.apk
          if-no-files-found: error
