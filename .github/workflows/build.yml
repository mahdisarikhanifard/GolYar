name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate Gol Negar source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GolNegar_v1.4.2_CircularRoleHome_Fixed.zip"

          echo "========================================"
          echo "BUILDING GOL NEGAR V1.4.2"
          echo "========================================"

          if [ ! -f "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found: $ZIP_FILE"
            echo "ZIP files available:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/build_source"
          mkdir -p "$GITHUB_WORKSPACE/build_source"

          unzip -q "$GITHUB_WORKSPACE/$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/build_source"

          PROJECT_SETTINGS="$(find "$GITHUB_WORKSPACE/build_source" \
            -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Validate source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/google-services.json
          test -f firestore.rules
          test -s app/src/main/java/com/example/golyar/MainActivity.kt
          test -f app/src/main/res/drawable/ic_bouquet.png
          test -f smoke_test.py

          echo "Checking app version..."
          grep -q 'versionName = "1.4.2"' app/build.gradle.kts
          grep -q 'versionCode = 72' app/build.gradle.kts

          echo "Checking circular menu fix..."
          grep -q 'rawY - (loc\[1\] + orbit.height / 2f)).toDouble()' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'rawX - (loc\[0\] + orbit.width / 2f)).toDouble()' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking navigation..."
          grep -q 'private fun detachFromParent(view: View)' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'OnBackPressedCallback' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking reports..."
          grep -q 'misc_sales' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'greenhouse_payments' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'private fun showFinancialReport()' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Source validation PASSED."

      - name: Run smoke tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          # Correct outdated version assertions in the test script.
          sed -i \
            's/versionName = "1\.4\.1"/versionName = "1.4.2"/g' \
            smoke_test.py

          sed -i \
            's/versionCode = 71/versionCode = 72/g' \
            smoke_test.py

          python smoke_test.py

      - name: Build Gol Negar v1.4.2
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          STATUS=${PIPESTATUS[0]}

          echo "GRADLE EXIT CODE: $STATUS"

          if [ "$STATUS" -ne 0 ]; then
            echo "========== BUILD ERRORS =========="
            grep -n -E \
              'error:|ERROR|FAILURE:|Execution failed|Unresolved reference|Caused by:' \
              "$GITHUB_WORKSPACE/build.log" | tail -n 200 || true

            echo "========== LAST LOG LINES =========="
            tail -n 250 "$GITHUB_WORKSPACE/build.log"
          fi

          exit "$STATUS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.4.2-build-log
          path: build.log
          if-no-files-found: warn

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK_SOURCE"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_SOURCE" \
            "$GITHUB_WORKSPACE/release/GolNegar-v1.4.2-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/release/GolNegar-v1.4.2-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.4.2-debug.apk
          path: release/GolNegar-v1.4.2-debug.apk
          if-no-files-found: error
