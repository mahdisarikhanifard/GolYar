name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate exact Gol Negar source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GolNegar_FullAuditFix_v1.3.2_ReportsFix.zip"

          echo "========================================"
          echo "BUILDING GOL NEGAR V1.3.2"
          echo "REPORTS FIX"
          echo "========================================"

          if [ ! -f "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
            echo "ERROR: Exact source ZIP not found:"
            echo "$ZIP_FILE"

            echo "ZIP files found in repository:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname '*.zip' \
              -print | sort

            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/build_source"

          mkdir -p "$GITHUB_WORKSPACE/build_source"

          unzip -q \
            "$GITHUB_WORKSPACE/$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/build_source"

          PROJECT_SETTINGS="$(
            find "$GITHUB_WORKSPACE/build_source" \
              -type f \
              -name settings.gradle.kts \
              -print -quit
          )"

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found inside source ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Validate source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDATING GOL NEGAR V1.3.2 SOURCE"
          echo "========================================"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/google-services.json
          test -f firestore.rules

          test -s \
            app/src/main/java/com/example/golyar/MainActivity.kt

          test -f \
            app/src/main/res/drawable/ic_bouquet.png

          test -f smoke_test.py

          grep -q \
            'versionName = "1.3.2"' \
            app/build.gradle.kts

          grep -q \
            'versionCode = 62' \
            app/build.gradle.kts

          echo "Checking navigation stack..."

          grep -q \
            'fun goBack()' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q \
            'screenBackStack.clear()' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q \
            'OnBackPressedCallback' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q \
            'private fun detachFromParent(view: View)' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q \
            'detachFromParent(root)' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking miscellaneous sales..."

          grep -q \
            'misc_sales' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q \
            'showMiscSales' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking greenhouse expenses..."

          grep -q \
            'greenhouse_payments' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q \
            'expense_types' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking reports..."

          grep -q \
            'showDetailedReport()' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q \
            'گزارش‌ها' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking miscellaneous sales in reports..."

          grep -q \
            'فروش متفرقه' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking greenhouse expenses in reports..."

          grep -q \
            'هزینه‌های گلخانه' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking Firebase expense/sales sync..."

          grep -q \
            'misc_sales' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q \
            'greenhouse_payments' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking home shortcut management..."

          grep -q \
            'HomeShortcut' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q \
            'homeShortcutEnabled' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking Persian flower sorting..."

          grep -q \
            'Collator.getInstance(Locale("fa","IR"))' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q \
            "replace('ي','ی')" \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking seller Firebase identity..."

          grep -q \
            'collection("users").document(firebaseUser.uid)' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q \
            'seller_remote_id' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Source validation PASSED."

      - name: Run smoke and audit tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "RUNNING SMOKE / AUDIT TESTS"
          echo "========================================"

          python smoke_test.py

      - name: Build Gol Negar v1.3.2
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          STATUS=${PIPESTATUS[0]}

          echo "GRADLE EXIT CODE: $STATUS"

          if [ "$STATUS" -ne 0 ]; then

            echo "========================================"
            echo "BUILD ERRORS"
            echo "========================================"

            grep -n -E \
              '(^|[^A-Za-z])(e:|error:|ERROR|FAILURE:|Execution failed|Syntax error|Unresolved reference|CompilationErrorException|Caused by:)' \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -n 300 || true

            echo "========================================"
            echo "LAST BUILD LOG LINES"
            echo "========================================"

            tail -n 350 \
              "$GITHUB_WORKSPACE/build.log"
          fi

          exit "$STATUS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.3.2-build-log
          path: build.log
          if-no-files-found: warn

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK_SOURCE"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp \
            "$APK_SOURCE" \
            "$GITHUB_WORKSPACE/release/GolNegar-v1.3.2-debug.apk"

          echo "APK CREATED:"
          ls -lh \
            "$GITHUB_WORKSPACE/release/GolNegar-v1.3.2-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.3.2-debug.apk
          path: release/GolNegar-v1.3.2-debug.apk
          if-no-files-found: error
