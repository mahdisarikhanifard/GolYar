name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate exact Gol Negar source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GolNegar_v1.4.5_VersionThenUserName.zip"

          echo "========================================"
          echo "BUILDING GOL NEGAR V1.4.5"
          echo "========================================"

          if [ ! -f "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found: $ZIP_FILE"
            echo "ZIP files found in repository:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname '*.zip' \
              -print | sort
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/build_source"
          mkdir -p "$GITHUB_WORKSPACE/build_source"

          unzip -q \
            "$GITHUB_WORKSPACE/$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/build_source"

          PROJECT_SETTINGS="$(
            find "$GITHUB_WORKSPACE/build_source" \
              -type f \
              -name settings.gradle.kts \
              -print -quit
          )"

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Validate source files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/google-services.json
          test -f firestore.rules
          test -s app/src/main/java/com/example/golyar/MainActivity.kt
          test -f app/src/main/res/drawable/ic_bouquet.png
          test -f smoke_test.py

          grep -q 'versionName = "1.4.5"' app/build.gradle.kts
          grep -q 'versionCode = 75' app/build.gradle.kts

          echo "Checking navigation..."
          grep -q 'private fun detachFromParent(view: View)' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'detachFromParent(root)' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'OnBackPressedCallback' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking miscellaneous sales..."
          grep -q 'misc_sales' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'fun miscSales()' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q '🧾 فروش متفرقه گلخانه' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking greenhouse expenses..."
          grep -q 'greenhouse_payments' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'fun greenhousePayments()' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q '💰 هزینه‌های گلخانه' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'private fun renderGreenhouseExpensesPage(title: String, subtitle: String)' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'private fun showMiscSalesReport()' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'private fun showGreenhouseExpensesReport()' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'sameLogicalScreen' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking report refresh..."
          grep -q 'private fun refreshAdminDataAndShow(after: () -> Unit)' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'after()' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'val saved=db.addMiscSale' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'val saved=db.addGreenhouseExpense' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking financial report..."
          grep -q 'private fun showFinancialReport()' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'گزارش مالی جامع' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'miscTotal' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'expenseTotal' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking Firebase collections..."
          grep -q '"misc_sales", "greenhouse_payments"' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'whereEqualTo("seller_remote_id", sellerRemoteId)' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'fs.collection("users")' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Source validation PASSED."

      - name: Run smoke tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 smoke_test.py

      - name: Build Gol Negar APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          STATUS=${PIPESTATUS[0]}

          echo "GRADLE EXIT CODE: $STATUS"

          if [ "$STATUS" -ne 0 ]; then
            echo "========== BUILD ERRORS =========="

            grep -n -E \
              '(^|[^A-Za-z])(e:|error:|ERROR|FAILURE:|Execution failed|Syntax error|Unresolved reference|CompilationErrorException|Caused by:)' \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -n 300 || true

            echo "========== LAST LOG LINES =========="
            tail -n 350 "$GITHUB_WORKSPACE/build.log"
          fi

          exit "$STATUS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.4.5-build-log
          path: build.log
          if-no-files-found: warn

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_SOURCE" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_SOURCE" \
            "$GITHUB_WORKSPACE/release/GolNegar-v1.4.5-debug.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/release/GolNegar-v1.4.5-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.4.5-debug.apk
          path: release/GolNegar-v1.4.5-debug.apk
          if-no-files-found: error
