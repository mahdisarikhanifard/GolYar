name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate EXACT Gol Negar V25.22 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/GolNegar_GitHubReady_v25.22_LoginFlowFix.zip"

          echo "Looking for:"
          echo "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: V25.22 ZIP not found."
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -name 'GolNegar*.zip' \
              -print \
              | sort
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/build_source"
          mkdir -p "$GITHUB_WORKSPACE/build_source"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/build_source"

          PROJECT_DIR=$(find \
            "$GITHUB_WORKSPACE/build_source" \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit \
            | xargs -r dirname)

          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify EXACT V25.22 source
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Project directory:"
          pwd

          echo
          echo "Checking version..."

          if ! grep -q 'versionName = "25.22"' app/build.gradle.kts; then
            echo "ERROR: versionName 25.22 not found."
            grep -n 'versionName\|versionCode' app/build.gradle.kts || true
            exit 1
          fi

          echo "OK: versionName 25.22"

          echo
          echo "Checking login flow..."

          if grep -q 'ERROR_USER_NOT_FOUND' \
            app/src/main/java/com/example/golyar/MainActivity.kt; then
            echo "OK: Firebase user-not-found handling found."
          else
            echo "ERROR: Firebase user-not-found handling missing."
            exit 1
          fi

          echo
          echo "Checking Firebase collections..."

          for COLLECTION in \
            flowers \
            sellers \
            deliveries \
            sales \
            returns \
            payments \
            misc_sales \
            greenhouse_payments \
            petty_cash_people \
            settings
          do
            if grep -q "$COLLECTION" \
              app/src/main/java/com/example/golyar/MainActivity.kt; then
              echo "OK: $COLLECTION"
            else
              echo "WARNING: $COLLECTION not found"
            fi
          done

          echo
          echo "V25.22 source verification completed."

      - name: Build Gol Negar V25.22
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo " BUILDING GOL NEGAR V25.22"
          echo "========================================"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Find APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print \
            | head -n 1)

          if [ -z "${APK:-}" ]; then
            echo "ERROR: APK not found."
            find app/build/outputs \
              -type f \
              -print 2>/dev/null || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/GolNegar-v25.22-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/release/GolNegar-v25.22-debug.apk"

      - name: Upload Gol Negar V25.22 APK
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v25.22-debug-apk
          path: release/GolNegar-v25.22-debug.apk
          if-no-files-found: error

      - name: Upload V25.22 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v25.22-build-log
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/logs/**
          if-no-files-found: warn
