name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify Gol Negar 1.5.4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="GolNegar_v1.5.4_Source.zip"
          if [ ! -s "$ZIP_FILE" ]; then
            echo "::error::فایل $ZIP_FILE در ریشه مخزن پیدا نشد. ZIP نسخه 1.5.4 را کنار پوشه .github قرار دهید."
            find . -maxdepth 3 -type f -iname '*.zip' -print || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/build_source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/build_source"
          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/build_source" -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle.kts داخل ZIP پیدا نشد."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Validate source and run smoke tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -s settings.gradle.kts
          test -s build.gradle.kts
          test -s app/build.gradle.kts
          test -s app/google-services.json
          test -s app/src/main/java/com/example/golyar/MainActivity.kt
          test -s smoke_test.py
          grep -q 'versionName = "1.5.4"' app/build.gradle.kts || {
            echo "::error::versionName در app/build.gradle.kts باید 1.5.4 باشد."
            exit 1
          }
          grep -q 'versionCode = 84' app/build.gradle.kts || {
            echo "::error::versionCode در app/build.gradle.kts باید 84 باشد."
            exit 1
          }
          python3 smoke_test.py

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleDebug --no-daemon --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify and stage APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/GolNegar-v1.5.4-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/release/GolNegar-v1.5.4-debug.apk"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.5.4-debug
          path: release/GolNegar-v1.5.4-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.5.4-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14
