name: Build Gol Negar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate exact Gol Negar source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GolNegar_StaffInvite_PaymentSyncFix_125.zip"

          echo "========================================"
          echo "BUILDING GOL NEGAR V1.2.5"
          echo "========================================"

          if [ ! -f "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found: $ZIP_FILE"
            echo
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/build_source"
          mkdir -p "$GITHUB_WORKSPACE/build_source"

          unzip -q "$GITHUB_WORKSPACE/$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/build_source"

          PROJECT_SETTINGS="$(
            find "$GITHUB_WORKSPACE/build_source" \
              -type f \
              -name settings.gradle.kts \
              -print -quit
          )"

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Validate source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/google-services.json
          test -f firestore.rules
          test -f app/src/main/java/com/example/golyar/MainActivity.kt

          echo "Checking version..."

          grep -q 'versionName = "1.2.5"' \
            app/build.gradle.kts

          grep -q 'versionCode = 56' \
            app/build.gradle.kts

          echo "Checking staff creation / invitation..."

          grep -q 'STAFF' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'staff_invites' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'staff_invites' \
            firestore.rules

          echo "Checking payment synchronization..."

          grep -q '"payments"' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'seller_remote_id' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'auth_uid' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'match /payments/{id}' \
            firestore.rules

          echo "Checking multi-user Rules..."

          grep -q 'function isGreenhouseUser' \
            firestore.rules

          grep -q 'role' \
            firestore.rules

          echo "Checking expense/miscellaneous sections..."

          grep -q 'misc_sales' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          grep -q 'expense_types' \
            app/src/main/java/com/example/golyar/MainActivity.kt

          echo
          echo "========================================"
          echo "SOURCE VALIDATION PASSED"
          echo "========================================"

      - name: Run smoke tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f smoke_test.py ]; then
            python smoke_test.py
          else
            echo "WARNING: smoke_test.py not found."
            echo "Continuing with Gradle build."
          fi

      - name: Build Gol Negar v1.2.5
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          STATUS=${PIPESTATUS[0]}

          echo
          echo "GRADLE EXIT CODE: $STATUS"
          echo

          if [ "$STATUS" -ne 0 ]; then

            echo "========================================"
            echo "BUILD FAILED — IMPORTANT ERRORS"
            echo "========================================"

            grep -n -E \
              '(^|[^A-Za-z])(e:|error:|ERROR|FAILURE:|Execution failed|Syntax error|Unresolved reference|CompilationErrorException|Caused by:)' \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -n 250 || true

            echo
            echo "========================================"
            echo "LAST 300 LOG LINES"
            echo "========================================"

            tail -n 300 "$GITHUB_WORKSPACE/build.log"
          fi

          exit "$STATUS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.2.5-build-log
          path: build.log
          if-no-files-found: warn

      - name: Prepare APK
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_SOURCE" ]; then
            echo "ERROR: APK not found:"
            echo "$APK_SOURCE"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_SOURCE" \
            "$GITHUB_WORKSPACE/release/GolNegar-v1.2.5-debug.apk"

          echo
          echo "========================================"
          echo "APK READY"
          echo "========================================"

          ls -lh \
            "$GITHUB_WORKSPACE/release/GolNegar-v1.2.5-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GolNegar-v1.2.5-debug.apk
          path: release/GolNegar-v1.2.5-debug.apk
          if-no-files-found: error
